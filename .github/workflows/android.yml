name: Android

on:
  push:
    branches: [main, claude/zealous-newton-a8gzpy]
    paths: ['mobile/**', 'src/lib/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'src/lib/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Typecheck and build the web layer
        run: npm run build
      - name: Copy the web layer and plugins into the Android project
        run: npx cap sync android
      - name: Build the debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rokela-pdf-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
