name: Android

on:
  push:
    branches: [main, claude/zealous-newton-a8gzpy]
    paths: ['mobile/**', 'src/lib/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'src/lib/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run of an older one, so a superseded build can never publish over a newer APK.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Typecheck and build the web layer
        run: npm run build
      - name: Browser smoke test of every tool
        run: |
          npx playwright@1.56.1 install --with-deps chromium
          npm run smoke
      - name: Copy the web layer and plugins into the Android project
        run: npx cap sync android
      # Test builds are debug-signed. Reusing one debug key lets a newer test build install over an older one; the
      # key only marks test builds (Google Play releases use the upload key, kept in repository secrets).
      - name: Reuse the test-build signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Build the debug APK
        working-directory: mobile/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rokela-pdf-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      # The Google Play release (docs/google-play.md): an Android App Bundle signed with the upload key. Built on every
      # run so a broken release build shows up in pull requests; signed and kept only when the upload key secrets are
      # set (they are not available to pull requests from forks).
      # Google Play does not allow pointing people to a way of paying outside Google Play, so its build says a licence is
      # needed but not how to buy one (VITE_DISTRIBUTION=play). The website APK above keeps the full wording.
      - name: Build the web layer for Google Play
        run: |
          VITE_DISTRIBUTION=play npx vite build
          if grep -rqE "Get a licence|quantixsl" dist; then
            echo "::error::The Google Play build must not say how to buy a licence (docs/google-play.md)"
            exit 1
          fi
          npx cap sync android
      - name: Build the Google Play bundle
        working-directory: mobile/android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            export ANDROID_UPLOAD_KEYSTORE="$RUNNER_TEMP/upload.jks"
            echo "SIGNED_BUNDLE=true" >> "$GITHUB_ENV"
          fi
          ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
      - if: env.SIGNED_BUNDLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rokela-pdf-google-play-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  # Every change on the default branch replaces the APK on the fixed "android" release, so the download link
  # https://github.com/<repo>/releases/download/android/rokela-pdf.apk (and rokelapdf.com/android) never changes.
  publish:
    needs: apk
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rokela-pdf-debug-apk
      - name: Publish to the android release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mv app-debug.apk rokela-pdf.apk
          notes="Test build of Rokela PDF for Android from ${SHA::7}, $(date -u '+%d %b %Y %H:%M UTC'). Install steps: https://www.rokelapdf.com/android"
          if gh release view android >/dev/null 2>&1; then
            gh release edit android --notes "$notes"
          else
            gh release create android --target "$SHA" --prerelease --title "Rokela PDF for Android (test build)" --notes "$notes"
          fi
          gh release upload android rokela-pdf.apk --clobber
