name: Android

on:
  push:
    branches: [main, claude/zealous-newton-a8gzpy]
    paths: ['mobile/**', 'src/lib/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['mobile/**', 'src/lib/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run of an older one, so a superseded build can never publish over a newer APK.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Typecheck and build the web layer
        run: npm run build
      - name: Copy the web layer and plugins into the Android project
        run: npx cap sync android
      # Test builds are debug-signed. Reusing one debug key lets a newer test build install over an older one; the
      # key only marks test builds (Play Store releases will use a separate release key kept out of the repository).
      - name: Reuse the test-build signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - name: Build the debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rokela-pdf-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # Every change on the default branch replaces the APK on the fixed "android" release, so the download link
  # https://github.com/<repo>/releases/download/android/rokela-pdf.apk (and rokelapdf.com/android) never changes.
  publish:
    needs: apk
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rokela-pdf-debug-apk
      - name: Publish to the android release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          mv app-debug.apk rokela-pdf.apk
          notes="Test build of Rokela PDF for Android from ${SHA::7}, $(date -u '+%d %b %Y %H:%M UTC'). Install steps: https://www.rokelapdf.com/android"
          if gh release view android >/dev/null 2>&1; then
            gh release edit android --notes "$notes"
          else
            gh release create android --target "$SHA" --prerelease --title "Rokela PDF for Android (test build)" --notes "$notes"
          fi
          gh release upload android rokela-pdf.apk --clobber
